name: Voice Controller Android APK

on:
  push:
    branches:
      - voice-controller-android
    paths:
      - 'voice-controller/**'
      - '.github/workflows/voice-controller-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test, lint and build debug APK
        working-directory: voice-controller
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK output
        run: test -s voice-controller/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-controller-debug-apk
          path: voice-controller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
