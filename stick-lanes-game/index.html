<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stick Lanes Prototype</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eee;background:#0d0d0f}*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:#eee}button,select{font:inherit}#app{max-width:1500px;margin:auto;padding:8px}.panel{background:#171719;border:1px solid #303036;border-radius:14px;padding:12px;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}h1,h2,p{margin:6px 0}.muted{color:#aaa;font-size:.92rem}.unitPool{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:7px;margin-top:10px}.unitBtn{background:#242429;border:1px solid #44444d;color:#eee;border-radius:10px;padding:9px;text-align:left;cursor:pointer}.unitBtn.selected{outline:2px solid #eee;background:#303038}.unitBtn small{display:block;color:#aaa;margin-top:2px}.primary{background:#eee;color:#111;border:0;border-radius:9px;padding:9px 13px;font-weight:800}.secondary{background:#27272d;color:#eee;border:1px solid #4a4a53;border-radius:9px;padding:8px 10px}.secondary.active{background:#eee;color:#111}.disabled{opacity:.45;pointer-events:none}#gameUI{display:none}#hud{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.badge{display:inline-block;background:#33333a;border-radius:999px;padding:3px 8px;font-size:.82rem;margin-left:4px}.laneControls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.laneControl{background:#121215;border:1px solid #303038;border-radius:10px;padding:8px}.laneControl strong{display:block;margin-bottom:5px}.laneBtns{display:flex;gap:5px;flex-wrap:wrap}.laneBtns button{font-size:.84rem;padding:7px 8px}.mapWrap{overflow-x:auto;border-radius:12px;border:1px solid #333;background:#0b0b0c;padding:0;scrollbar-width:thin}.mapWrap canvas{display:block;width:1600px;max-width:none;height:auto;background:#cabf9f;touch-action:pan-x}.spawnbar{display:grid;grid-template-columns:repeat(8,minmax(115px,1fr));gap:6px;overflow-x:auto}.spawn{min-width:115px;background:#222228;color:#fff;border:1px solid #44444c;border-radius:9px;padding:8px;cursor:pointer}.spawn b,.spawn small{display:block}.spawn small{color:#aaa}.spawn:disabled{opacity:.35;cursor:not-allowed}.tag{display:inline-block;font-size:.68rem;background:#34343d;border-radius:999px;padding:2px 5px;margin:2px 2px 0 0;color:#ddd}@media(max-width:800px){#app{padding:5px}.laneControls{grid-template-columns:1fr}.unitPool{grid-template-columns:repeat(2,1fr)}.mapWrap canvas{width:1250px}.spawnbar{grid-template-columns:repeat(8,125px)}}
</style>
</head>
<body>
<div id="app">
  <div id="setup" class="panel">
    <h1>Stick Lanes — protótipo</h1>
    <p class="muted">3 lanes • 3 torres por lane • 2 facções • 8 unidades • stick figures originais</p>
    <div class="row">
      <label>Facção 1 <select id="f1"></select></label>
      <label>Facção 2 <select id="f2"></select></label>
      <button class="secondary" id="refreshPool">Atualizar unidades</button>
    </div>
    <h2>Escolha 8 unidades <span id="count" class="badge">0/8</span></h2>
    <div id="pool" class="unitPool"></div>
    <div class="row" style="margin-top:10px"><button id="start" class="primary disabled">Começar batalha</button></div>
  </div>

  <div id="gameUI">
    <div class="panel" id="hud">
      <div><b>Ouro:</b> <span id="gold">0</span> <span class="badge">+30 / 2s</span> <span class="badge">abate 10%</span></div>
      <div><b>Base:</b> <span id="playerBase">3000</span> | <b>Inimiga:</b> <span id="enemyBase">3000</span></div>
      <div><b>Torres:</b> <span id="playerTowers">9</span> × <span id="enemyTowers">9</span></div>
      <button id="restart" class="secondary">Recomeçar</button>
    </div>
    <div class="panel laneControls" id="laneControls"></div>
    <div class="mapWrap" id="mapWrap"><canvas id="game" width="1800" height="900"></canvas></div>
    <div class="panel"><div id="spawnbar" class="spawnbar"></div><p class="muted">Toque numa lane do mapa e depois numa unidade. As ordens valem para toda a lane.</p></div>
  </div>
</div>
<script>
const TAGS={
"Camponês":["Corpo a corpo"],"Espadachim":["Corpo a corpo"],"Escudeiro":["Corpo a corpo","Tanque"],"Lanceiro":["Corpo a corpo"],"Arqueiro":["À distância"],"Besteiro":["À distância","Perfurante"],"Cavaleiro":["Corpo a corpo","Elite"],"Cavaleiro Pesado":["Corpo a corpo","Tanque","Elite"],"Mercenário":["Corpo a corpo","Assassino"],"Padre":["Suporte","À distância"],"Inquisidor":["Corpo a corpo","Elite"],"Caçador":["À distância"],"Médico":["Suporte"],"Carrasco":["Corpo a corpo","Elite"],"Comandante":["Corpo a corpo","Elite"],"Catapulta":["Cerco","À distância"],"Balista":["Cerco","À distância","Perfurante"],"Aríete":["Cerco","Tanque"],"Nobre":["Corpo a corpo","Elite"],"Rei":["Única","Suporte","Elite"],
"Gosma":["Corpo a corpo","Monstro"],"Massa Pulsante":["Tanque","Monstro"],"Trípode":["Corpo a corpo","Monstro"],"Olho Flutuante":["À distância","Voador","Monstro"],"Boca Ambulante":["Corpo a corpo","Monstro"],"Parasita":["Assassino","Controle","Monstro"],"Cuspidor":["À distância","Monstro"],"Bolha Voadora":["Voador","Explosivo","Monstro"],"Tentacular":["Controle","Monstro"],"Cérebro Gigante":["Suporte","Controle","Monstro"],"Casulo":["Invocador","Monstro"],"Devorador":["Corpo a corpo","Elite","Monstro"],"Translúcido":["Assassino","Monstro"],"Aberração Gigante":["Tanque","Elite","Monstro"],
"Iniciado":["À distância"],"Empurrador":["Controle"],"Puxador":["Controle"],"Paralisador":["Controle"],"Confusor":["Controle"],"Dominador":["Controle","Elite"],"Ilusionista":["Suporte","Controle"],"Escudeiro Psíquico":["Tanque","Suporte"],"Levitador":["Controle"],"Telepata":["À distância","Perfurante"],"Drenador":["Corpo a corpo"],"Oráculo":["Suporte"],"Pesadelo":["Controle"],"Projetor Astral":["Suporte","Elite"],"Mente Coletiva":["Suporte","Controle"],"Anulador":["Controle","Elite"],"Implosor":["À distância"],"Saltador Mental":["Corpo a corpo","Assassino"],"Mestre Mentalista":["Elite","Controle"],"Entidade Psíquica":["Única","Controle","Elite"]};
function U(name,hp,def,atk,speed,range,rate,cost,gen,special={}){return{name,hp,def,atk,speed,range,rate,cost,gen,special,tags:TAGS[name]||[]}}
const FACTIONS={
"Medievais":[U("Camponês",30,10,20,6,1,1.4,50,4),U("Espadachim",50,40,50,5,1.2,1.1,100,7),U("Escudeiro",70,80,20,3,1,1.5,125,9,{block:.35}),U("Lanceiro",50,40,50,5,2.2,1.35,115,8,{antiMounted:.4}),U("Arqueiro",40,20,50,5,11,1.15,130,9),U("Besteiro",40,30,70,4,13,2.3,165,12,{armorPierce:.3}),U("Cavaleiro",70,60,70,9,1.5,1.25,225,15,{charge:.6}),U("Cavaleiro Pesado",90,90,70,5,1.5,1.55,320,21),U("Mercenário",50,30,80,7,1.2,.8,180,11),U("Padre",40,20,30,4,9,1.7,200,15,{heal:{cool:6,pct:.15,range:8}}),U("Inquisidor",60,50,70,5,1.3,1.15,235,17),U("Caçador",50,30,60,7,10,1,155,10),U("Médico",40,20,10,6,1,2,165,13),U("Carrasco",70,40,90,3,1.4,2.2,215,16,{execute:.5}),U("Comandante",70,70,70,6,1.3,1,250,18),U("Catapulta",50,20,90,1,18,4.5,300,24,{splash:true}),U("Balista",50,30,100,1,20,4,325,25,{armorPierce:.45}),U("Aríete",100,80,10,2,1.3,2.8,285,22,{siege:10}),U("Nobre",60,50,60,7,1.3,.95,175,12),U("Rei",60,60,40,4,1.4,1.3,550,30,{unique:true,kingAura:.2})],
"Alienígenas":[U("Gosma",40,10,30,3,1,1.3,55,4,{split:true}),U("Massa Pulsante",90,50,40,2,1.2,1.7,170,13,{regen:true}),U("Trípode",50,30,60,9,1.3,1,145,9,{leap:{cool:9,bonus:.8}}),U("Olho Flutuante",40,20,60,6,10,1.3,155,10,{flying:true}),U("Boca Ambulante",60,30,80,6,1,1.1,180,12),U("Parasita",30,10,30,8,1,.9,120,8,{parasite:{cool:10,duration:6,pct:.02}}),U("Cuspidor",50,30,60,4,9,1.6,190,14,{acid:true}),U("Bolha Voadora",30,10,70,7,1,9,105,7,{kamikaze:true,flying:true}),U("Tentacular",70,50,60,3,4,1.5,215,16,{pull:{cool:11,range:10}}),U("Cérebro Gigante",50,20,30,2,8,2,250,19,{confuse:{cool:14,duration:4}}),U("Casulo",80,60,0,1,0,99,225,18,{hatch:18}),U("Devorador",80,50,80,5,1.2,1.4,270,20,{devour:.15}),U("Translúcido",50,20,70,7,1.3,1,205,15,{stealth:6}),U("Aberração Gigante",100,80,100,2,2,2,500,30,{splash:true})],
"Mentalistas":[U("Iniciado",40,20,50,5,8,1.3,110,7),U("Empurrador",50,30,40,4,7,1.6,145,10,{push:{cool:8}}),U("Puxador",50,30,40,4,8,1.7,165,11,{pull:{cool:10,range:10}}),U("Paralisador",40,20,40,4,8,1.7,190,14,{stun:{cool:10,duration:2.5}}),U("Confusor",40,20,40,5,9,1.5,175,12,{confuse:{cool:12,duration:5}}),U("Dominador",50,30,30,3,8,2,390,26,{limit:2,dominate:{cool:30,duration:10,range:10}}),U("Ilusionista",40,20,40,6,8,1.5,195,14,{illusion:{cool:18}}),U("Escudeiro Psíquico",70,60,20,3,6,1.8,220,16,{barrier:{cool:10,duration:5,pct:.15}}),U("Levitador",50,30,40,4,8,1.7,220,16,{stun:{cool:14,duration:3}}),U("Telepata",40,20,70,5,11,1.4,175,12,{armorPierce:.35}),U("Drenador",60,30,60,5,7,1.3,190,13,{lifesteal:.3}),U("Oráculo",50,30,50,6,8,1.3,210,15,{dodge:.3}),U("Pesadelo",50,30,50,4,8,1.6,240,17,{fear:{cool:15}}),U("Projetor Astral",50,20,60,5,8,1.3,260,19,{projection:{cool:12}}),U("Mente Coletiva",60,40,10,3,7,2.2,325,23,{limit:2,groupHeal:{cool:4,pct:.05,targets:3,range:10}}),U("Anulador",50,40,40,3,9,1.8,425,28,{limit:1,nullify:{cool:35,duration:8,range:11}}),U("Implosor",50,30,80,3,9,2.2,250,18,{splash:true}),U("Saltador Mental",50,30,70,7,1.2,1,225,16),U("Mestre Mentalista",70,50,80,5,9,1.2,335,24),U("Entidade Psíquica",80,60,70,3,10,1.5,700,30,{unique:true,steal:{cool:90,range:12}})]};

const setup=document.querySelector('#setup'),gameUI=document.querySelector('#gameUI'),f1=document.querySelector('#f1'),f2=document.querySelector('#f2'),pool=document.querySelector('#pool'),count=document.querySelector('#count'),startBtn=document.querySelector('#start'),canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
Object.keys(FACTIONS).forEach(n=>{f1.add(new Option(n,n));f2.add(new Option(n,n))});f1.value='Medievais';f2.value='Alienígenas';
let chosen=[];const loadout=[];
function tagsHtml(u){return u.tags.slice(0,3).map(x=>`<span class="tag">${x}</span>`).join('')}
function renderPool(){if(f1.value===f2.value){const names=Object.keys(FACTIONS);f2.value=names[(names.indexOf(f1.value)+1)%names.length]}chosen=[];pool.innerHTML='';[...FACTIONS[f1.value].map(u=>[f1.value,u]),...FACTIONS[f2.value].map(u=>[f2.value,u])].forEach(([fac,u])=>{const b=document.createElement('button');b.className='unitBtn';b.innerHTML=`<b>${u.name}</b><small>${fac} • ${u.cost} ouro • ${u.gen}s</small><div>${tagsHtml(u)}</div>`;b.onclick=()=>{const key=fac+'|'+u.name,i=chosen.indexOf(key);if(i>=0){chosen.splice(i,1);b.classList.remove('selected')}else if(chosen.length<8){chosen.push(key);b.classList.add('selected')}count.textContent=chosen.length+'/8';startBtn.classList.toggle('disabled',chosen.length!==8)};pool.appendChild(b)});count.textContent='0/8';startBtn.classList.add('disabled')}
document.querySelector('#refreshPool').onclick=renderPool;f1.onchange=renderPool;f2.onchange=renderPool;renderPool();
function unitByKey(key){const [fac,name]=key.split('|');return{fac,u:FACTIONS[fac].find(x=>x.name===name)}}

const laneY=[160,450,740],PX=22,BASE_X={1:80,'-1':1720};
const towerXs={1:[300,520,740],'-1':[1500,1280,1060]};
const towerTypes=[{name:'Traseira',hp:1000,atk:36,range:11,rate:1.4},{name:'Central',hp:800,atk:30,range:10,rate:1.5},{name:'Avançada',hp:600,atk:24,range:9,rate:1.6}];
let units=[],structures=[],effects=[],gold=500,enemyGold=500,playerBase=3000,enemyBase=3000,selectedLane=1,last=performance.now(),running=false,incomeTimer=0;
const stance=['advance','advance','advance'],spawnCooldown={};
function makeStructures(){structures=[];for(const side of [1,-1])for(let lane=0;lane<3;lane++)towerXs[side].forEach((x,i)=>{const tt=towerTypes[i];structures.push({side,lane,x,y:laneY[lane],kind:'tower',label:tt.name,hp:tt.hp,maxHp:tt.hp,atk:tt.atk,range:tt.range,rate:tt.rate,lastAttack:0,dead:false})})}
function aliveTowers(side,lane){return structures.filter(s=>!s.dead&&s.side===side&&s.lane===lane)}
function baseHp(side){return side===1?playerBase:enemyBase}
function damageBase(side,amount){if(side===1)playerBase=Math.max(0,playerBase-amount);else enemyBase=Math.max(0,enemyBase-amount)}

startBtn.onclick=()=>{if(chosen.length!==8)return;loadout.splice(0,99,...chosen.map(unitByKey));setup.style.display='none';gameUI.style.display='block';buildUI();resetGame()};
document.querySelector('#restart').onclick=()=>location.reload();
function setStance(lane,value,root){stance[lane]=value;root.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.order===value))}
function buildUI(){const lc=document.querySelector('#laneControls');lc.innerHTML='';[0,1,2].forEach(i=>{const d=document.createElement('div');d.className='laneControl';d.innerHTML=`<strong>Lane ${i+1}</strong><div class="laneBtns"><button class="secondary" data-order="base">Base</button><button class="secondary" data-order="behind">Atrás da torre</button><button class="secondary" data-order="tower">Na torre</button><button class="secondary" data-order="ahead">À frente</button><button class="secondary active" data-order="advance">Avançar</button></div>`;d.querySelectorAll('button').forEach(b=>b.onclick=()=>setStance(i,b.dataset.order,d));lc.appendChild(d)});const sb=document.querySelector('#spawnbar');sb.innerHTML='';loadout.forEach(({u},idx)=>{const b=document.createElement('button');b.className='spawn';b.innerHTML=`<b>${u.name}</b><small>${u.cost} • ${u.gen}s</small>`;b.onclick=()=>spawnPlayer(idx);b.dataset.i=idx;sb.appendChild(b)})}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),y=(e.clientY-r.top)*canvas.height/r.height;selectedLane=laneY.map(v=>Math.abs(v-y)).indexOf(Math.min(...laneY.map(v=>Math.abs(v-y))))});
function resetGame(){units=[];effects=[];makeStructures();gold=500;enemyGold=500;playerBase=enemyBase=3000;selectedLane=1;incomeTimer=0;running=true;last=performance.now();requestAnimationFrame(loop)}
function spawnPlayer(idx){const {fac,u}=loadout[idx],key='p'+idx,now=performance.now()/1000;if(gold<u.cost||now<(spawnCooldown[key]||0))return;if(u.special.unique&&units.some(x=>x.side===1&&x.name===u.name&&!x.dead))return;if(u.special.limit&&units.filter(x=>x.side===1&&x.name===u.name&&!x.dead).length>=u.special.limit)return;gold-=u.cost;spawnCooldown[key]=now+u.gen;spawnUnit(1,selectedLane,fac,u)}
function spawnUnit(side,lane,fac,u){units.push({side,lane,fac,name:u.name,cost:u.cost||0,tags:u.tags||[],x:side===1?125:1675,y:laneY[lane],hp:u.hp,maxHp:u.hp,def:u.def,atk:u.atk,speed:u.speed,range:u.range,rate:u.rate,special:u.special,lastAttack:0,lastSkill:-999,stunUntil:0,confuseUntil:0,dominatedUntil:0,origSide:side,dead:false,rewarded:false,chargeReady:true,anim:Math.random()*6,born:performance.now()/1000})}
function enemyAI(){if(Math.random()<.014){const facs=Object.keys(FACTIONS),fac=facs[Math.floor(Math.random()*facs.length)],roster=FACTIONS[fac],u=roster[Math.floor(Math.random()*roster.length)];if(enemyGold>=u.cost&&!(u.special.unique&&units.some(x=>x.side===-1&&x.name===u.name&&!x.dead))&&(!u.special.limit||units.filter(x=>x.side===-1&&x.name===u.name&&!x.dead).length<u.special.limit)){enemyGold-=u.cost;spawnUnit(-1,Math.floor(Math.random()*3),fac,u)}}}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;incomeTimer+=dt;if(incomeTimer>=2){const ticks=Math.floor(incomeTimer/2);gold+=30*ticks;enemyGold+=30*ticks;incomeTimer-=2*ticks}enemyAI();update(dt,now/1000);updateTowers(now/1000);draw(now/1000);updateHUD(now/1000);if(playerBase<=0||enemyBase<=0){running=false;setTimeout(()=>alert(playerBase>0?'Vitória!':'Derrota!'),50);return}requestAnimationFrame(loop)}
function awardKill(v,killerSide){if(v.rewarded)return;v.rewarded=true;const reward=Math.floor((v.cost||0)*.10);if(reward<=0)return;if(killerSide===1)gold+=reward;else if(killerSide===-1)enemyGold+=reward}
function nearestEnemy(u,range){return units.filter(v=>!v.dead&&v.side!==u.side&&v.lane===u.lane&&Math.abs(v.x-u.x)<=range*PX).sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x))[0]}
function nextEnemyStructure(u){const candidates=aliveTowers(-u.side,u.lane).filter(s=>u.side===1?s.x>=u.x-10:s.x<=u.x+10);if(!candidates.length)return{kind:'base',side:-u.side,lane:u.lane,x:BASE_X[-u.side],y:laneY[u.lane],hp:baseHp(-u.side)};return candidates.sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x))[0]}
function defensiveTargetX(u){const order=stance[u.lane];if(order==='base')return BASE_X[u.side]+(u.side===1?70:-70);const ts=aliveTowers(u.side,u.lane);if(!ts.length)return BASE_X[u.side]+(u.side===1?70:-70);const ref=ts.sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x))[0];if(order==='behind')return ref.x-(u.side*75);if(order==='ahead')return ref.x+(u.side*75);return ref.x-(u.side*20)}
function moveToward(u,x,dt){const delta=x-u.x;if(Math.abs(delta)<5)return;u.x+=Math.sign(delta)*u.speed*12*dt}
function update(dt,t){for(const u of units){if(u.dead)continue;if(u.dominatedUntil&&t>u.dominatedUntil){u.side=u.origSide;u.dominatedUntil=0}if(t<u.stunUntil)continue;applySupport(u,t);let foe=nearestEnemy(u,u.range);const structure=nextEnemyStructure(u),structureInRange=structure&&Math.abs(structure.x-u.x)<=u.range*PX;const siege=u.tags.includes('Cerco');if(siege&&structureInRange){if(t-u.lastAttack>=u.rate){attackStructure(u,structure);u.lastAttack=t}}else if(foe){if(t-u.lastAttack>=u.rate){attack(u,foe,t);u.lastAttack=t}}else if(stance[u.lane]==='advance'||u.side===-1){if(structureInRange){if(t-u.lastAttack>=u.rate){attackStructure(u,structure);u.lastAttack=t}}else moveToward(u,structure.x,dt)}else moveToward(u,defensiveTargetX(u),dt);
if(u.special.regen&&t-u.lastAttack>3)u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.015*dt);if(u.special.hatch&&t-u.born>=u.special.hatch){u.dead=true;const hatch=U('Abominação Jovem',80,40,70,6,1.2,1.1,0,0);spawnUnit(u.side,u.lane,u.fac,hatch)}}units=units.filter(u=>!u.dead&&u.hp>0)}
function attackStructure(a,s){let dmg=a.atk;if(a.special.siege)dmg*=a.special.siege;else if(a.tags.includes('Cerco'))dmg*=1.35;if(s.kind==='base'){damageBase(s.side,dmg)}else{s.hp-=dmg;if(s.hp<=0){s.hp=0;s.dead=true}}effects.push({type:'structureHit',x:s.x,y:s.y,t:performance.now()/1000,side:a.side})}
function attack(a,b,t){if(Math.random()<(b.special.dodge||0))return;let dmg=a.atk;if(a.special.armorPierce)dmg*=1+a.special.armorPierce;if(a.special.charge&&a.chargeReady){dmg*=1+a.special.charge;a.chargeReady=false}if(a.special.execute&&b.hp/b.maxHp<.3)dmg*=1+a.special.execute;if(a.special.kamikaze){dmg*=1.3;a.dead=true}const reduction=Math.min(.75,b.def/(b.def+120));dmg*=1-reduction;if(b.special.block&&((b.side===1&&a.x>b.x)||(b.side===-1&&a.x<b.x)))dmg*=1-b.special.block;b.hp-=dmg;if(b.hp<=0){b.dead=true;awardKill(b,a.side)}if(a.special.lifesteal)a.hp=Math.min(a.maxHp,a.hp+dmg*a.special.lifesteal);if(a.special.acid)b.def=Math.max(0,b.def-2);if(a.special.splash)for(const v of units)if(v!==b&&v.side===b.side&&v.lane===b.lane&&Math.abs(v.x-b.x)<45){v.hp-=dmg*.35;if(v.hp<=0){v.dead=true;awardKill(v,a.side)}}if(a.special.devour&&b.hp<=0)a.hp=Math.min(a.maxHp,a.hp+a.maxHp*a.special.devour);effects.push({type:'hit',x:b.x,y:b.y,t:performance.now()/1000,side:a.side});if(b.hp<=0&&b.special.split){for(let i=0;i<2;i++){const baby=U('Gosminha',12,3,9,4,1,.9,0,0);spawnUnit(b.side,b.lane,b.fac,baby);units.at(-1).x=b.x+(i?12:-12)}}}
function updateTowers(t){for(const s of structures){if(s.dead||s.kind!=='tower'||t-s.lastAttack<s.rate)continue;const targets=units.filter(u=>!u.dead&&u.side!==s.side&&u.lane===s.lane&&Math.abs(u.x-s.x)<=s.range*PX).sort((a,b)=>Math.abs(a.x-s.x)-Math.abs(b.x-s.x));const v=targets[0];if(!v)continue;const reduction=Math.min(.65,v.def/(v.def+140));const dmg=s.atk*(1-reduction);v.hp-=dmg;if(v.hp<=0)v.dead=true;s.lastAttack=t;effects.push({type:'towerShot',x1:s.x,y1:s.y-42,x2:v.x,y2:v.y-10,t,side:s.side});if(v.hp<=0)awardKill(v,s.side)}}
function applySupport(u,t){const s=u.special;if(s.heal&&t-u.lastSkill>=s.heal.cool){const allies=units.filter(v=>v.side===u.side&&v.lane===u.lane&&v!==u&&Math.abs(v.x-u.x)<=s.heal.range*PX&&v.hp<v.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp);if(allies[0]){allies[0].hp=Math.min(allies[0].maxHp,allies[0].hp+allies[0].maxHp*s.heal.pct);u.lastSkill=t}}
if(s.groupHeal&&t-u.lastSkill>=s.groupHeal.cool){const allies=units.filter(v=>v.side===u.side&&v.lane===u.lane&&Math.abs(v.x-u.x)<=s.groupHeal.range*PX&&v.hp<v.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp).slice(0,s.groupHeal.targets);if(allies.length){allies.forEach(v=>v.hp=Math.min(v.maxHp,v.hp+v.maxHp*s.groupHeal.pct));u.lastSkill=t}}
if(s.stun&&t-u.lastSkill>=s.stun.cool){const v=nearestEnemy(u,s.stun.range||u.range);if(v){v.stunUntil=t+s.stun.duration;u.lastSkill=t}}
if(s.confuse&&t-u.lastSkill>=s.confuse.cool){const v=nearestEnemy(u,u.range);if(v){v.confuseUntil=t+s.confuse.duration;u.lastSkill=t}}
if(s.dominate&&t-u.lastSkill>=s.dominate.cool){const v=nearestEnemy(u,s.dominate.range);if(v&&!v.special.unique){v.origSide=v.side;v.side=u.side;v.dominatedUntil=t+s.dominate.duration;u.lastSkill=t}}
if(s.steal&&t-u.lastSkill>=s.steal.cool){const v=nearestEnemy(u,s.steal.range);if(v&&v.name!=='Entidade Psíquica'&&!v.special.unique){v.side=u.side;v.origSide=u.side;v.dominatedUntil=0;u.lastSkill=t}}
if(s.pull&&t-u.lastSkill>=s.pull.cool){const v=nearestEnemy(u,s.pull.range||10);if(v){v.x=u.x+(u.side===1?25:-25);v.hp-=u.atk*.5;if(v.hp<=0){v.dead=true;awardKill(v,u.side)}u.lastSkill=t}}
if(s.push&&t-u.lastSkill>=s.push.cool){const v=nearestEnemy(u,8);if(v){v.x+=u.side===1?55:-55;u.lastSkill=t}}
if(s.fear&&t-u.lastSkill>=s.fear.cool){for(const v of units)if(v.side!==u.side&&v.lane===u.lane&&Math.abs(v.x-u.x)<160)v.x+=u.side===1?65:-65;u.lastSkill=t}}
function updateHUD(t){document.querySelector('#gold').textContent=Math.floor(gold);document.querySelector('#playerBase').textContent=Math.ceil(playerBase);document.querySelector('#enemyBase').textContent=Math.ceil(enemyBase);document.querySelector('#playerTowers').textContent=structures.filter(s=>!s.dead&&s.side===1).length;document.querySelector('#enemyTowers').textContent=structures.filter(s=>!s.dead&&s.side===-1).length;document.querySelectorAll('.spawn').forEach((b,idx)=>{const {u}=loadout[idx],left=Math.max(0,(spawnCooldown['p'+idx]||0)-t);b.disabled=gold<u.cost||left>0;b.querySelector('small').textContent=left>0?`${left.toFixed(1)}s`:`${u.cost} • ${u.gen}s`})}
function factionColor(u){if(u.fac==='Mentalistas')return u.side===1?'#8a52d1':'#d66aa9';if(u.fac==='Alienígenas')return u.side===1?'#45b66d':'#d25a58';return u.side===1?'#4b78b8':'#b84949'}
function draw(t){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#cbbf9e';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<3;i++){ctx.fillStyle=i===selectedLane?'#d8cda9':'#cec39f';ctx.fillRect(35,laneY[i]-105,1730,210);ctx.strokeStyle='#8b8065';ctx.lineWidth=3;ctx.strokeRect(35,laneY[i]-105,1730,210)}drawBases();for(const s of structures)drawTower(s);for(const u of units)drawUnit(u,t);drawEffects(t)}
function drawBases(){for(const side of [1,-1]){const x=BASE_X[side],hp=baseHp(side),dir=side===1?1:-1;ctx.save();ctx.translate(x,450);ctx.fillStyle=side===1?'#27384d':'#542c31';ctx.fillRect(-42,-315,84,630);ctx.fillStyle='#161619';ctx.fillRect(-30,-285,60,570);ctx.fillStyle='#d7b56d';for(let y=-250;y<=250;y+=125)ctx.fillRect(dir*10-8,y-22,16,44);ctx.fillStyle='#111';ctx.fillRect(-45,-340,90,10);ctx.fillStyle='#48a866';ctx.fillRect(-45,-340,90*Math.max(0,hp/3000),10);ctx.fillStyle='#eee';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('BASE',0,-350);ctx.restore()}}
function drawTower(s){if(s.dead)return;ctx.save();ctx.translate(s.x,s.y);const friendly=s.side===1;ctx.fillStyle=friendly?'#3c506b':'#693840';ctx.strokeStyle='#24242a';ctx.lineWidth=4;ctx.fillRect(-24,-55,48,105);ctx.strokeRect(-24,-55,48,105);ctx.beginPath();ctx.moveTo(-34,-55);ctx.lineTo(0,-82);ctx.lineTo(34,-55);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#e4bd63';ctx.beginPath();ctx.arc(0,-48,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-32,-96,64,7);ctx.fillStyle='#46a864';ctx.fillRect(-32,-96,64*(s.hp/s.maxHp),7);ctx.fillStyle='#29282b';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(`${s.label} ${Math.ceil(s.hp)}`,0,72);ctx.restore()}
function drawUnit(u,t){const c=factionColor(u),bob=Math.sin(t*7+u.anim)*2,attackPose=(t-u.lastAttack)<.18?1:0;ctx.save();ctx.translate(u.x,u.y+bob);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=5;ctx.lineCap='round';const big=u.name.includes('Gigante')||u.name==='Rei'||u.name==='Entidade Psíquica';const sc=big?1.28:1.08;ctx.scale(sc,sc);if(u.fac==='Alienígenas'){drawAlien(u,t,c)}else{ctx.beginPath();ctx.arc(0,-25,10,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(0,24);ctx.moveTo(0,-4);ctx.lineTo(-15,9+attackPose*3);ctx.moveTo(0,-4);ctx.lineTo(18+attackPose*8,5);ctx.moveTo(0,24);ctx.lineTo(-12,43);ctx.moveTo(0,24);ctx.lineTo(12,43);ctx.stroke();if(u.fac==='Mentalistas'){ctx.globalAlpha=.35;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-25,19+Math.sin(t*5+u.anim)*3,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(u.side*23,3,5,0,Math.PI*2);ctx.fill()}else drawMedievalGear(u)}ctx.scale(1/sc,1/sc);ctx.fillStyle='#111';ctx.fillRect(-28,-66,56,7);ctx.fillStyle='#35a65d';ctx.fillRect(-28,-66,56*Math.max(0,u.hp/u.maxHp),7);ctx.fillStyle='#18181b';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(u.name,0,64);ctx.restore()}
function drawMedievalGear(u){const dir=u.side;if(u.tags.includes('À distância')){ctx.beginPath();ctx.moveTo(dir*14,-3);ctx.lineTo(dir*31,-3);ctx.stroke();ctx.beginPath();ctx.arc(dir*24,-3,10,-1.2,1.2);ctx.stroke()}else if(u.tags.includes('Tanque')){ctx.lineWidth=3;ctx.beginPath();ctx.arc(-dir*15,6,12,0,Math.PI*2);ctx.stroke()}else{ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(dir*15,4);ctx.lineTo(dir*30,-10);ctx.stroke()}if(u.name==='Rei'){ctx.beginPath();ctx.moveTo(-9,-38);ctx.lineTo(-4,-48);ctx.lineTo(0,-39);ctx.lineTo(5,-49);ctx.lineTo(10,-38);ctx.stroke()}}
function drawAlien(u,t,c){if(['Gosma','Massa Pulsante','Bolha Voadora','Casulo'].includes(u.name)){ctx.beginPath();ctx.ellipse(0,12,20,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#151518';ctx.beginPath();ctx.arc(-6,7,3,0,Math.PI*2);ctx.arc(6,7,3,0,Math.PI*2);ctx.fill()}else if(u.name==='Olho Flutuante'){ctx.beginPath();ctx.arc(0,-4,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0e1a0';ctx.beginPath();ctx.arc(0,-4,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17171a';ctx.beginPath();ctx.arc(2,-4,3,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.arc(0,-20,10,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,23);ctx.moveTo(0,1);ctx.quadraticCurveTo(-26,5+Math.sin(t*5)*4,-18,25);ctx.moveTo(0,1);ctx.quadraticCurveTo(26,5-Math.sin(t*5)*4,18,25);ctx.moveTo(0,23);ctx.lineTo(-13,43);ctx.moveTo(0,23);ctx.lineTo(13,43);ctx.stroke();if(u.name==='Tentacular'){ctx.beginPath();ctx.moveTo(-12,6);ctx.quadraticCurveTo(-35,-3,-29,-31);ctx.moveTo(12,6);ctx.quadraticCurveTo(35,-3,29,-31);ctx.stroke()}}}
function drawEffects(t){for(const e of effects){const age=t-e.t;if(age>.28)continue;ctx.save();ctx.globalAlpha=1-age/.28;if(e.type==='towerShot'){ctx.strokeStyle=e.side===1?'#f1c95f':'#ff7575';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke()}else{ctx.fillStyle=e.type==='structureHit'?'#ffb14a':'#fff2a6';ctx.beginPath();ctx.arc(e.x,e.y-15,8+age*30,0,Math.PI*2);ctx.fill()}ctx.restore()}effects=effects.filter(e=>t-e.t<=.3)}
</script>
