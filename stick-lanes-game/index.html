<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stick Lanes Prototype</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eee;background:#111}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee}button,select{font:inherit}#app{max-width:1300px;margin:auto;padding:10px}.panel{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}h1,h2,p{margin:6px 0}.muted{color:#aaa;font-size:.92rem}.unitPool,.loadout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:10px}.unitBtn{background:#242424;border:1px solid #444;color:#eee;border-radius:10px;padding:8px;text-align:left;cursor:pointer}.unitBtn.selected{outline:2px solid #ddd;background:#303030}.unitBtn small{display:block;color:#aaa}.primary{background:#eee;color:#111;border:0;border-radius:9px;padding:9px 13px;font-weight:700}.secondary{background:#292929;color:#eee;border:1px solid #555;border-radius:9px;padding:8px 12px}.secondary.active{background:#eee;color:#111}.disabled{opacity:.45;pointer-events:none}#gameUI{display:none}#hud{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.laneControls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1;min-width:300px}.laneControl{background:#181818;border:1px solid #333;border-radius:8px;padding:7px;text-align:center}.laneControl button{margin:2px}canvas{display:block;width:100%;height:auto;background:#d8d0bb;border:1px solid #333;border-radius:10px;touch-action:none}.spawnbar{display:grid;grid-template-columns:repeat(8,minmax(90px,1fr));gap:6px;margin-top:8px;overflow-x:auto}.spawn{min-width:90px;background:#222;color:#fff;border:1px solid #444;border-radius:9px;padding:7px;cursor:pointer}.spawn b,.spawn small{display:block}.spawn:disabled{opacity:.35;cursor:not-allowed}.badge{display:inline-block;background:#333;border-radius:999px;padding:2px 7px;font-size:.8rem;margin-left:4px}@media(max-width:700px){#app{padding:6px}.spawnbar{grid-template-columns:repeat(8,105px)}.laneControls{grid-template-columns:1fr}.unitPool{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div id="setup" class="panel">
    <h1>Stick Lanes — protótipo</h1>
    <p class="muted">3 lanes • 2 facções • 8 unidades • arte stickman original</p>
    <div class="row">
      <label>Facção 1 <select id="f1"></select></label>
      <label>Facção 2 <select id="f2"></select></label>
      <button class="secondary" id="refreshPool">Atualizar unidades</button>
    </div>
    <h2>Escolha 8 unidades <span id="count" class="badge">0/8</span></h2>
    <div id="pool" class="unitPool"></div>
    <div class="row" style="margin-top:10px"><button id="start" class="primary disabled">Começar batalha</button></div>
  </div>

  <div id="gameUI">
    <div class="panel" id="hud">
      <div><b>Ouro:</b> <span id="gold">0</span> <span class="badge">+22/s</span></div>
      <div><b>Base:</b> <span id="playerBase">1000</span> | <b>Inimiga:</b> <span id="enemyBase">1000</span></div>
      <button id="restart" class="secondary">Recomeçar</button>
    </div>
    <div class="panel laneControls" id="laneControls"></div>
    <canvas id="game" width="1280" height="650"></canvas>
    <div class="panel"><div id="spawnbar" class="spawnbar"></div><p class="muted">Toque numa lane e depois numa unidade para gerar nela. As ordens Avançar/Ficar valem por lane.</p></div>
  </div>
</div>
<script>
const FACTIONS={
  "Medievais":[
    U("Camponês",30,10,20,6,1,1.4,50,4),U("Espadachim",50,40,50,5,1.2,1.1,100,7),U("Escudeiro",70,80,20,3,1,1.5,125,9,{block:.35}),U("Lanceiro",50,40,50,5,2.2,1.35,115,8,{antiMounted:.4}),U("Arqueiro",40,20,50,5,11,1.15,130,9),U("Besteiro",40,30,70,4,13,2.3,165,12,{armorPierce:.3}),U("Cavaleiro",70,60,70,9,1.5,1.25,225,15,{charge:.6}),U("Cavaleiro Pesado",90,90,70,5,1.5,1.55,320,21),U("Mercenário",50,30,80,7,1.2,.8,180,11),U("Padre",40,20,30,4,9,1.7,200,15,{heal:{cool:6,pct:.15,range:8}}),U("Inquisidor",60,50,70,5,1.3,1.15,235,17),U("Caçador",50,30,60,7,10,1,155,10),U("Médico",40,20,10,6,1,2,165,13),U("Carrasco",70,40,90,3,1.4,2.2,215,16,{execute:.5}),U("Comandante",70,70,70,6,1.3,1,250,18),U("Catapulta",50,20,90,1,18,4.5,300,24,{splash:true}),U("Balista",50,30,100,1,20,4,325,25,{armorPierce:.45}),U("Aríete",100,80,10,2,1.3,2.8,285,22,{siege:10}),U("Nobre",60,50,60,7,1.3,.95,175,12),U("Rei",60,60,40,4,1.4,1.3,550,30,{unique:true,kingAura:.2})
  ],
  "Alienígenas":[
    U("Gosma",40,10,30,3,1,1.3,55,4,{split:true}),U("Massa Pulsante",90,50,40,2,1.2,1.7,170,13,{regen:true}),U("Trípode",50,30,60,9,1.3,1,145,9,{leap:{cool:9,bonus:.8}}),U("Olho Flutuante",40,20,60,6,10,1.3,155,10,{flying:true}),U("Boca Ambulante",60,30,80,6,1,1.1,180,12),U("Parasita",30,10,30,8,1,.9,120,8,{parasite:{cool:10,duration:6,pct:.02}}),U("Cuspidor",50,30,60,4,9,1.6,190,14,{acid:true}),U("Bolha Voadora",30,10,70,7,1,9,105,7,{kamikaze:true,flying:true}),U("Tentacular",70,50,60,3,4,1.5,215,16,{pull:{cool:11,range:10}}),U("Cérebro Gigante",50,20,30,2,8,2,250,19,{confuse:{cool:14,duration:4}}),U("Casulo",80,60,0,1,0,99,225,18,{hatch:18}),U("Devorador",80,50,80,5,1.2,1.4,270,20,{devour:.15}),U("Translúcido",50,20,70,7,1.3,1,205,15,{stealth:6}),U("Aberração Gigante",100,80,100,2,2,2,500,30,{splash:true})
  ],
  "Mentalistas":[
    U("Iniciado",40,20,50,5,8,1.3,110,7),U("Empurrador",50,30,40,4,7,1.6,145,10,{push:{cool:8}}),U("Puxador",50,30,40,4,8,1.7,165,11,{pull:{cool:10,range:10}}),U("Paralisador",40,20,40,4,8,1.7,190,14,{stun:{cool:10,duration:2.5}}),U("Confusor",40,20,40,5,9,1.5,175,12,{confuse:{cool:12,duration:5}}),U("Dominador",50,30,30,3,8,2,390,26,{limit:2,dominate:{cool:30,duration:10,range:10}}),U("Ilusionista",40,20,40,6,8,1.5,195,14,{illusion:{cool:18}}),U("Escudeiro Psíquico",70,60,20,3,6,1.8,220,16,{barrier:{cool:10,duration:5,pct:.15}}),U("Levitador",50,30,40,4,8,1.7,220,16,{stun:{cool:14,duration:3}}),U("Telepata",40,20,70,5,11,1.4,175,12,{armorPierce:.35}),U("Drenador",60,30,60,5,7,1.3,190,13,{lifesteal:.3}),U("Oráculo",50,30,50,6,8,1.3,210,15,{dodge:.3}),U("Pesadelo",50,30,50,4,8,1.6,240,17,{fear:{cool:15}}),U("Projetor Astral",50,20,60,5,8,1.3,260,19,{projection:{cool:12}}),U("Mente Coletiva",60,40,10,3,7,2.2,325,23,{limit:2,groupHeal:{cool:4,pct:.05,targets:3,range:10}}),U("Anulador",50,40,40,3,9,1.8,425,28,{limit:1,nullify:{cool:35,duration:8,range:11}}),U("Implosor",50,30,80,3,9,2.2,250,18,{splash:true}),U("Saltador Mental",50,30,70,7,1.2,1,225,16),U("Mestre Mentalista",70,50,80,5,9,1.2,335,24),U("Entidade Psíquica",80,60,70,3,10,1.5,700,30,{unique:true,steal:{cool:90,range:12}})
  ]
};
function U(name,hp,def,atk,speed,range,rate,cost,gen,special={}){return{name,hp,def,atk,speed,range,rate,cost,gen,special}}

const setup=document.querySelector('#setup'),gameUI=document.querySelector('#gameUI'),f1=document.querySelector('#f1'),f2=document.querySelector('#f2'),pool=document.querySelector('#pool'),count=document.querySelector('#count'),startBtn=document.querySelector('#start');
Object.keys(FACTIONS).forEach(n=>{f1.add(new Option(n,n));f2.add(new Option(n,n))});f1.value='Medievais';f2.value='Alienígenas';
let chosen=[];
function renderPool(){if(f1.value===f2.value){const names=Object.keys(FACTIONS);f2.value=names[(names.indexOf(f1.value)+1)%names.length]}chosen=[];pool.innerHTML='';[...FACTIONS[f1.value].map(u=>[f1.value,u]),...FACTIONS[f2.value].map(u=>[f2.value,u])].forEach(([fac,u])=>{const b=document.createElement('button');b.className='unitBtn';b.innerHTML=`<b>${u.name}</b><small>${fac} • ${u.cost} ouro • ${u.gen}s</small>`;b.onclick=()=>{const key=fac+'|'+u.name;const i=chosen.indexOf(key);if(i>=0){chosen.splice(i,1);b.classList.remove('selected')}else if(chosen.length<8){chosen.push(key);b.classList.add('selected')}count.textContent=chosen.length+'/8';startBtn.classList.toggle('disabled',chosen.length!==8)};pool.appendChild(b)});count.textContent='0/8';startBtn.classList.add('disabled')}
document.querySelector('#refreshPool').onclick=renderPool;f1.onchange=renderPool;f2.onchange=renderPool;renderPool();

const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const laneY=[150,325,500];let units=[],effects=[],gold=500,enemyGold=500,playerBase=1000,enemyBase=1000,selectedLane=1,last=performance.now(),running=false;const stance=['advance','advance','advance'];const spawnCooldown={};
const loadout=[];
function unitByKey(key){const [fac,name]=key.split('|');return{fac,u:FACTIONS[fac].find(x=>x.name===name)}}
startBtn.onclick=()=>{if(chosen.length!==8)return;loadout.splice(0,99,...chosen.map(unitByKey));setup.style.display='none';gameUI.style.display='block';buildUI();resetGame()};
document.querySelector('#restart').onclick=()=>location.reload();
function buildUI(){const lc=document.querySelector('#laneControls');lc.innerHTML='';[0,1,2].forEach(i=>{const d=document.createElement('div');d.className='laneControl';d.innerHTML=`Lane ${i+1} <button class="secondary adv active">Avançar</button><button class="secondary hold">Ficar</button>`;d.querySelector('.adv').onclick=()=>{stance[i]='advance';d.querySelector('.adv').classList.add('active');d.querySelector('.hold').classList.remove('active')};d.querySelector('.hold').onclick=()=>{stance[i]='hold';d.querySelector('.hold').classList.add('active');d.querySelector('.adv').classList.remove('active')};lc.appendChild(d)});const sb=document.querySelector('#spawnbar');sb.innerHTML='';loadout.forEach(({fac,u},idx)=>{const b=document.createElement('button');b.className='spawn';b.innerHTML=`<b>${u.name}</b><small>${u.cost} • ${u.gen}s</small>`;b.onclick=()=>spawnPlayer(idx);b.dataset.i=idx;sb.appendChild(b)})}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),y=(e.clientY-r.top)*canvas.height/r.height;selectedLane=Math.max(0,Math.min(2,Math.round((y-150)/175)))});
function resetGame(){units=[];effects=[];gold=500;enemyGold=500;playerBase=enemyBase=1000;selectedLane=1;running=true;last=performance.now();requestAnimationFrame(loop)}
function spawnPlayer(idx){const {fac,u}=loadout[idx],key='p'+idx,now=performance.now()/1000;if(gold<u.cost||now<(spawnCooldown[key]||0))return;if(u.special.unique&&units.some(x=>x.side===1&&x.name===u.name))return;if(u.special.limit&&units.filter(x=>x.side===1&&x.name===u.name).length>=u.special.limit)return;gold-=u.cost;spawnCooldown[key]=now+u.gen;spawnUnit(1,selectedLane,fac,u)}
function spawnUnit(side,lane,fac,u){units.push({side,lane,fac,name:u.name,x:side===1?75:1205,y:laneY[lane],hp:u.hp,maxHp:u.hp,def:u.def,atk:u.atk,speed:u.speed,range:u.range,rate:u.rate,special:u.special,lastAttack:0,lastSkill:-999,stunUntil:0,confuseUntil:0,dominatedUntil:0,origSide:side,dead:false,chargeReady:true})}
function enemyAI(t){enemyGold+=22/60;if(Math.random()<.015){const facs=Object.keys(FACTIONS),fac=facs[Math.floor(Math.random()*facs.length)],roster=FACTIONS[fac],u=roster[Math.floor(Math.random()*roster.length)];if(enemyGold>=u.cost&&!(u.special.unique&&units.some(x=>x.side===-1&&x.name===u.name))&&(!u.special.limit||units.filter(x=>x.side===-1&&x.name===u.name).length<u.special.limit)){enemyGold-=u.cost;spawnUnit(-1,Math.floor(Math.random()*3),fac,u)}}}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;gold+=22*dt;enemyAI(now/1000);update(dt,now/1000);draw(now/1000);updateHUD(now/1000);if(playerBase<=0||enemyBase<=0){running=false;setTimeout(()=>alert(playerBase>0?'Vitória!':'Derrota!'),50);return}requestAnimationFrame(loop)}
function update(dt,t){for(const u of units){if(u.dead)continue;if(u.dominatedUntil&&t>u.dominatedUntil){u.side=u.origSide;u.dominatedUntil=0}if(t<u.stunUntil)continue;applySupport(u,t);let foes=units.filter(v=>!v.dead&&v.lane===u.lane&&v.side!==u.side);if(u.confuseUntil>t)foes=units.filter(v=>!v.dead&&v.lane===u.lane&&v!==u);foes.sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x));const target=foes[0],pxRange=u.range*18;if(target&&Math.abs(target.x-u.x)<=pxRange){if(t-u.lastAttack>=u.rate){attack(u,target,t);u.lastAttack=t}}else{const dir=u.side===1?1:-1,hold=(u.side===1&&stance[u.lane]==='hold');if(!hold)u.x+=dir*u.speed*10*dt;if(u.x>1235){enemyBase-=u.atk*.25;u.dead=true}else if(u.x<45){playerBase-=u.atk*.25;u.dead=true}}
 if(u.special.regen&&t-u.lastAttack>3)u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.015*dt);if(u.special.hatch&&t-u.lastSkill>=u.special.hatch){u.dead=true;const hatch=U('Abominação Jovem',80,40,70,6,1.2,1.1,0,0);spawnUnit(u.side,u.lane,u.fac,hatch)} }
 units=units.filter(u=>!u.dead&&u.hp>0)}
function attack(a,b,t){if(Math.random()<(b.special.dodge||0))return;let dmg=a.atk;if(a.special.armorPierce)dmg*=1+a.special.armorPierce;if(a.special.charge&&a.chargeReady){dmg*=1+a.special.charge;a.chargeReady=false}if(a.special.execute&&b.hp/b.maxHp<.3)dmg*=1+a.special.execute;if(a.special.kamikaze){dmg*=1.3;a.dead=true}const reduction=Math.min(.75,b.def/(b.def+120));dmg*=1-reduction;if(b.special.block&&((b.side===1&&a.x>b.x)||(b.side===-1&&a.x<b.x)))dmg*=1-b.special.block;b.hp-=dmg;if(a.special.lifesteal)a.hp=Math.min(a.maxHp,a.hp+dmg*a.special.lifesteal);if(a.special.acid)b.def=Math.max(0,b.def-2);if(a.special.splash)for(const v of units)if(v!==b&&v.side===b.side&&v.lane===b.lane&&Math.abs(v.x-b.x)<35)v.hp-=dmg*.35;if(a.special.devour&&b.hp<=0)a.hp=Math.min(a.maxHp,a.hp+a.maxHp*a.special.devour);effects.push({x:b.x,y:b.y,t:performance.now()/1000,type:'hit'});if(b.hp<=0&&b.special.split){for(let i=0;i<2;i++){const baby=U('Gosminha',12,3,9,4,1,.9,0,0);spawnUnit(b.side,b.lane,b.fac,baby);units.at(-1).x=b.x+(i?10:-10)}}}
function applySupport(u,t){const s=u.special;if(s.heal&&t-u.lastSkill>=s.heal.cool){const allies=units.filter(v=>v.side===u.side&&v.lane===u.lane&&v!==u&&Math.abs(v.x-u.x)<=s.heal.range*18&&v.hp<v.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp);if(allies[0]){allies[0].hp=Math.min(allies[0].maxHp,allies[0].hp+allies[0].maxHp*s.heal.pct);u.lastSkill=t}}
if(s.groupHeal&&t-u.lastSkill>=s.groupHeal.cool){const allies=units.filter(v=>v.side===u.side&&v.lane===u.lane&&Math.abs(v.x-u.x)<=s.groupHeal.range*18&&v.hp<v.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp).slice(0,s.groupHeal.targets);if(allies.length){allies.forEach(v=>v.hp=Math.min(v.maxHp,v.hp+v.maxHp*s.groupHeal.pct));u.lastSkill=t}}
if(s.stun&&t-u.lastSkill>=s.stun.cool){const v=nearestEnemy(u,s.stun.range||u.range);if(v){v.stunUntil=t+s.stun.duration;u.lastSkill=t}}
if(s.confuse&&t-u.lastSkill>=s.confuse.cool){const v=nearestEnemy(u,u.range);if(v){v.confuseUntil=t+s.confuse.duration;u.lastSkill=t}}
if(s.dominate&&t-u.lastSkill>=s.dominate.cool){const v=nearestEnemy(u,s.dominate.range);if(v&&!v.special.unique){v.origSide=v.side;v.side=u.side;v.dominatedUntil=t+s.dominate.duration;u.lastSkill=t}}
if(s.steal&&t-u.lastSkill>=s.steal.cool){const v=nearestEnemy(u,s.steal.range);if(v&&v.name!=='Entidade Psíquica'&&!v.special.unique){v.side=u.side;v.origSide=u.side;v.dominatedUntil=0;u.lastSkill=t}}
if(s.pull&&t-u.lastSkill>=s.pull.cool){const v=nearestEnemy(u,s.pull.range||10);if(v){v.x=u.x+(u.side===1?18:-18);v.hp-=u.atk*.5;u.lastSkill=t}}
if(s.push&&t-u.lastSkill>=s.push.cool){const v=nearestEnemy(u,8);if(v){v.x+=u.side===1?45:-45;u.lastSkill=t}}
if(s.fear&&t-u.lastSkill>=s.fear.cool){for(const v of units)if(v.side!==u.side&&v.lane===u.lane&&Math.abs(v.x-u.x)<140)v.x+=u.side===1?55:-55;u.lastSkill=t}
}
function nearestEnemy(u,range){return units.filter(v=>!v.dead&&v.side!==u.side&&v.lane===u.lane&&Math.abs(v.x-u.x)<=range*18).sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x))[0]}
function updateHUD(t){document.querySelector('#gold').textContent=Math.floor(gold);document.querySelector('#playerBase').textContent=Math.max(0,Math.ceil(playerBase));document.querySelector('#enemyBase').textContent=Math.max(0,Math.ceil(enemyBase));document.querySelectorAll('.spawn').forEach((b,idx)=>{const {u}=loadout[idx],left=Math.max(0,(spawnCooldown['p'+idx]||0)-t);b.disabled=gold<u.cost||left>0;b.querySelector('small').textContent=left>0?`${left.toFixed(1)}s`:`${u.cost} • ${u.gen}s`})}
function draw(t){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#d8d0bb';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<3;i++){ctx.fillStyle=i===selectedLane?'#c9c09f':'#cfc6aa';ctx.fillRect(40,laneY[i]-62,1200,124);ctx.strokeStyle='#8d846b';ctx.lineWidth=2;ctx.strokeRect(40,laneY[i]-62,1200,124);for(let x=340;x<1100;x+=300){ctx.fillStyle='#77705d';ctx.fillRect(x-7,laneY[i]-55,14,110)}}ctx.fillStyle='#333';ctx.fillRect(15,80,28,490);ctx.fillRect(1237,80,28,490);ctx.fillStyle='#fff';ctx.font='18px system-ui';ctx.fillText('BASE',7,65);ctx.fillText('BASE',1217,65);for(const u of units)drawUnit(u,t)}
function drawUnit(u,t){const enemy=u.side===-1;ctx.save();ctx.translate(u.x,u.y);ctx.strokeStyle=enemy?'#8c1d1d':u.fac==='Mentalistas'?'#6c32a8':u.fac==='Alienígenas'?'#236d45':'#1d2c45';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=4;const scale=u.name.includes('Gigante')||u.name==='Rei'?1.25:1;ctx.scale(scale,scale);if(u.fac==='Alienígenas'&&['Gosma','Massa Pulsante','Parasita','Bolha Voadora','Casulo'].includes(u.name)){ctx.beginPath();ctx.ellipse(0,8,15,13,0,0,Math.PI*2);ctx.fill();if(u.name==='Parasita'){ctx.beginPath();ctx.moveTo(-12,15);ctx.lineTo(-22,24);ctx.moveTo(12,15);ctx.lineTo(22,24);ctx.stroke()}}else{ctx.beginPath();ctx.arc(0,-18,8,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,20);ctx.moveTo(0,-2);ctx.lineTo(-12,8);ctx.moveTo(0,-2);ctx.lineTo(12,8);ctx.moveTo(0,20);ctx.lineTo(-10,36);ctx.moveTo(0,20);ctx.lineTo(10,36);ctx.stroke();if(u.range>5){ctx.beginPath();ctx.moveTo(enemy?-10:10,5);ctx.lineTo(enemy?-22:22,5);ctx.stroke()}}ctx.scale(1/scale,1/scale);ctx.fillStyle='#111';ctx.fillRect(-20,-48,40,5);ctx.fillStyle='#2d9b50';ctx.fillRect(-20,-48,40*Math.max(0,u.hp/u.maxHp),5);ctx.fillStyle='#111';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(u.name,0,52);ctx.restore()}
</script>
</body>
</html>
